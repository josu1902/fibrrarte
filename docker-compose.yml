version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: fibrarte_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fibrarte_db
      MYSQL_USER: fibrarte
      MYSQL_PASSWORD: fibrarte123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: fibrarte_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://fibrarte:fibrarte123@mysql:3306/fibrarte_db
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      NEXT_PUBLIC_WHATSAPP: "5493875717430"
      NEXT_PUBLIC_INSTAGRAM: "https://www.instagram.com/fibrarte.stores/"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  mysql_data:
